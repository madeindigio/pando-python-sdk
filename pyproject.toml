[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pando-sdk"
version = "0.1.0"
description = "Python SDK for the pando AI coding assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pando Contributors" }]
requires-python = ">=3.10"
keywords = ["pando", "ai", "coding-assistant", "sdk", "acp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# No mandatory dependencies — only the standard library is required.
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.24.0"]
# Only the async AG-UI API needs httpx; the sync one is standard library only.
agui = ["httpx>=0.24.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.24.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/digiogithub/pando"
Repository = "https://github.com/digiogithub/pando"
Documentation = "https://github.com/digiogithub/pando/blob/main/sdk/python/README.md"
"Bug Tracker" = "https://github.com/digiogithub/pando/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pando"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
